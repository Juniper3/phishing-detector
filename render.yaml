services:

  # ── Backend API (FastAPI + uvicorn) ────────────────────────────
  - type: web
    name: phishing-detector-api
    runtime: python
    region: singapore        # ใกล้ไทยที่สุด
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"

  # ── Frontend (React + Vite static site) ────────────────────────
  - type: static
    name: phishing-detector-frontend
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false   # ตั้งค่าใน Render dashboard หลัง backend deploy แล้ว
                      # ค่าที่ต้องใส่: https://phishing-detector-api.onrender.com/api/v1/predict
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA routing — redirect ทุก path ไป index.html
